name: Aggiorna Post Release Telegram

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-telegram:
    runs-on: ubuntu-latest
    steps:
      - name: Recupera dati ultima release
        id: latest_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh api repos/${{ github.repository }}/releases/latest)
          TAG=$(echo "$RELEASE_JSON" | jq -r '.tag_name // empty')
          URL=$(echo "$RELEASE_JSON" | jq -r '.html_url // empty')
          DATE=$(echo "$RELEASE_JSON" | jq -r '.published_at // empty' | cut -d'T' -f1)

          if [ -z "$URL" ]; then
            URL="https://github.com/${{ github.repository }}/releases/latest"
          fi

          echo "tag=${TAG:-N/D}" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "date=${DATE:-N/D}" >> $GITHUB_OUTPUT

      - name: Aggiorna messaggio su Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_ID: ${{ secrets.TELEGRAM_MESSAGE_ID }}
          REL_TAG: ${{ steps.latest_release.outputs.tag }}
          REL_DATE: ${{ steps.latest_release.outputs.date }}
          REL_URL: ${{ steps.latest_release.outputs.url }}
        run: |
          TEXT=$(cat <<EOF
          📦 <b>Ultima Release Disponibile</b>

          🔖 <b>Versione:</b> ${REL_TAG}
          📅 <b>Data:</b> ${REL_DATE}
          🔗 ${REL_URL}
          EOF
          )

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/editMessageText" \
            -d "chat_id=${CHAT_ID}" \
            -d "message_id=${MESSAGE_ID}" \
            -d "parse_mode=HTML" \
            --data-urlencode "text=${TEXT}"
